[project]
name = "znextscan"
version = "0.2.0"
description = "Mainframe Ransomware Readiness Assessment Scanner"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "paramiko>=3.4",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "structlog>=24.1",
    "jsonschema>=4.20",
    "openpyxl>=3.1",
]

[project.scripts]
znextscan = "znextscan.cli:cli"

[project.optional-dependencies]
pdf = [
    "weasyprint>=60.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.8",
    "weasyprint>=60.0",
    "types-PyYAML",
    "types-paramiko",
    "types-jsonschema",
    "types-openpyxl",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["weasyprint"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.setuptools.packages.find]
include = ["znextscan*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
