[project]
name = "znextscan"
version = "0.1.0"
description = "zNextScan — mainframe security & frontier-AI readiness scanner for IBM Z (MRRA + Mythos profiles)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
keywords = ["mainframe", "zos", "ibm-z", "security", "racf", "ransomware", "frontier-ai"]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "paramiko>=3.4",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "structlog>=24.1",
    "jsonschema>=4.20",
    "openpyxl>=3.1",
]

[project.scripts]
znextscan = "znextscan.cli:cli"

[project.optional-dependencies]
pdf = [
    "weasyprint>=60.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.8",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.setuptools.packages.find]
include = ["znextscan*"]

[tool.setuptools.package-data]
znextscan = ["data/*.json"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
